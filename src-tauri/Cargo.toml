[package]
name = "med"
version = "0.1.0"
description = "A focused WYSIWYG Markdown editor"
authors = ["Pablo Medina"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "med_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
base64 = "0.22.1"
docx-rs = "0.4.22"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
printpdf = { version = "0.12.5", default-features = false, features = ["html", "bmp", "gif", "jpeg", "png", "webp"] }
pulldown-cmark = "0.13.4"
thiserror = "2"
ureq = { version = "3.3.0", default-features = false, features = ["gzip", "rustls"] }
url = "2.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
